    <article class="proj-row">
      <a href="proyectos/${slug}.html" data-cursor="ver" aria-label="${aria}">
        <div class="proj-media" data-img-reveal data-encuadre="completo"><img src="assets/img/${cover}" alt="${alt}" loading="${carga}" decoding="async" fetchpriority="low"></div>
        <div class="proj-info">
          <div class="proj-idx"><span class="num">${indice}</span><span class="num">${anio}</span></div>
          <div class="proj-logo" aria-hidden="true">${logo}</div>
          <h3 class="proj-title display">${nombre}</h3>
          <div class="proj-meta">${tags}</div>
          <p class="proj-client">${cliente}</p>
        </div>
      </a>
    </article>
